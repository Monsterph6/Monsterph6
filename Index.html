<style>
  :root {
    --do: #7b1e1e;
    --do-dam: #5c1414;
    --vang: #c9a227;
    --nen: #f7f1e3;
    --giay: #fffdf5;
    --muc: #2f2a24;
    --nam: #dbe9f6;
    --nam-vien: #6b93b8;
    --nu: #fbe4e8;
    --nu-vien: #c98a9a;
    --khac: #eeeeee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Ép in đúng màu nền/màu chữ như trên màn hình, bất kể tùy chọn "Background graphics"
     trong hộp thoại in có bật hay không (thuộc tính này kế thừa xuống toàn bộ phần tử con). */
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--nen);
    color: var(--muc);
    min-height: 100vh;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, var(--do-dam), var(--do));
    color: #fff;
    padding: 14px 18px 10px;
    border-bottom: 4px solid var(--vang);
  }
  header h1 {
    font-size: 19px;
    letter-spacing: .5px;
    text-align: center;
    text-transform: uppercase;
    color: #ffe9a8;
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    justify-content: center; margin-top: 10px;
  }
  .toolbar input[type=search] {
    padding: 7px 12px; border: none; border-radius: 18px;
    min-width: 230px; font-size: 14px; outline: none;
  }
  .btn {
    background: var(--vang); color: #3c2b00; border: none;
    padding: 7px 14px; border-radius: 18px; font-size: 13px;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: rgba(255,255,255,.15); color: #fff; }
  .tabs { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  .tab {
    background: rgba(255,255,255,.12); color: #fff; border: none;
    padding: 7px 16px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--nen); color: var(--do); font-weight: 700; }

  /* ===== Vùng nội dung ===== */
  .view { display: none; }
  .view.active { display: block; }
  #loading { text-align: center; padding: 60px 20px; font-size: 16px; color: var(--do); }

  /* ===== Phả đồ (cây) ===== */
  #treeWrap {
    overflow: hidden; cursor: grab; height: calc(100vh - 132px);
    position: relative; user-select: none;
  }
  #treeWrap.dragging { cursor: grabbing; }
  #treeCanvas { transform-origin: 0 0; position: absolute; padding: 30px; }
  .tree ul { display: flex; padding-top: 26px; position: relative; justify-content: center; }
  .tree li {
    list-style: none; text-align: center; position: relative;
    padding: 26px 8px 0;
  }
  /* đường nối */
  .tree li::before, .tree li::after {
    content: ''; position: absolute; top: 0; right: 50%;
    border-top: 2px solid var(--do); width: 50%; height: 26px;
  }
  .tree li::after { right: auto; left: 50%; border-left: 2px solid var(--do); }
  .tree li:only-child::after, .tree li:only-child::before { display: none; }
  .tree li:only-child { padding-top: 0; }
  .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
  .tree li:last-child::before { border-right: 2px solid var(--do); border-radius: 0 6px 0 0; }
  .tree li:first-child::after { border-radius: 6px 0 0 0; }
  .tree ul ul::before {
    content: ''; position: absolute; top: 0; left: 50%;
    border-left: 2px solid var(--do); width: 0; height: 26px;
  }
  .tree > ul > li { padding-top: 0; }
  .tree > ul > li::before, .tree > ul > li::after { display: none; }

  .card {
    display: inline-block; background: var(--giay);
    border: 2px solid var(--nam-vien); border-radius: 10px;
    padding: 8px 10px; min-width: 150px; max-width: 220px;
    box-shadow: 0 2px 5px rgba(0,0,0,.15); cursor: pointer;
    transition: transform .12s, box-shadow .12s; text-align: center;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.25); }
  .card.nu { border-color: var(--nu-vien); }
  .card.hl { outline: 3px solid var(--vang); outline-offset: 2px; }
  .card .doi-tag {
    font-size: 10px; color: #fff; background: var(--do);
    border-radius: 8px; padding: 1px 8px; display: inline-block; margin-bottom: 4px;
  }
  .card .ten { font-weight: 700; font-size: 14px; color: var(--do-dam); }
  .card.nu .ten { color: #8a3a4d; }
  .card .chucdanh { font-size: 11px; color: #6d5a2e; font-style: italic; margin-top: 2px; }
  .card .gio { font-size: 11px; color: #444; margin-top: 2px; }
  .card .spouse {
    border-top: 1px dashed #bba; margin-top: 6px; padding-top: 4px;
    font-size: 12px; color: #555;
  }
  .card .spouse b { color: #7d4a58; font-weight: 600; }
  .zoombar {
    position: absolute; right: 14px; bottom: 14px; z-index: 5;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zoombar button {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: var(--do); color: #fff; font-size: 17px; cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
  }

  /* ===== Danh sách theo đời ===== */
  #listView, #gioView { padding: 18px; max-width: 1000px; margin: 0 auto; }
  .doi-block { margin-bottom: 22px; }
  .doi-block h2 {
    color: var(--do); font-size: 16px; border-bottom: 2px solid var(--vang);
    padding-bottom: 4px; margin-bottom: 10px;
  }
  table { width: 100%; border-collapse: collapse; background: var(--giay); font-size: 14px; }
  th, td { border: 1px solid #dcd2b8; padding: 7px 10px; text-align: left; }
  th { background: #efe6cd; color: var(--do-dam); }
  tr:hover td { background: #faf4e0; }
  .link { color: var(--do); cursor: pointer; font-weight: 600; text-decoration: underline; }

  /* ===== Modal ===== */
  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20;
    align-items: center; justify-content: center; padding: 16px;
  }
  #overlay.open { display: flex; }
  .modal {
    background: var(--giay); border-radius: 12px; max-width: 520px; width: 100%;
    max-height: 92vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .modal-head {
    background: var(--do); color: #fff; padding: 12px 16px;
    border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center;
  }
  .modal-head h3 { font-size: 16px; }
  .modal-head .close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
  .modal-body { padding: 16px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #6d5a2e; margin-bottom: 3px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 7px 9px; border: 1px solid #cbbf9e; border-radius: 6px;
    font-size: 14px; background: #fff;
  }
  .field textarea { resize: vertical; min-height: 54px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn.solid { background: var(--do); color: #fff; }
  .btn.danger { background: #fff; color: #b02a2a; border: 1px solid #b02a2a; }
  .info-line { margin-bottom: 6px; font-size: 14px; }
  .info-line b { color: var(--do-dam); }
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; display: none; z-index: 50;
  }
  @media print {
    header .toolbar, header .tabs, .zoombar { display: none; }
    /* min-height:100vh lúc in cao hơn vùng in được → thân trang tràn sinh trang trắng thừa */
    body { min-height: 0; }
    #treeWrap { overflow: visible; height: auto; }

    /* ===== Trang trí kiểu tranh gia phả truyền thống (chỉ khi in phả đồ) ===== */
    body.printing-tree header { display: none; }
    body.printing-tree #printPhoto { visibility: visible; }
  }
  /* Mặc định ẩn trang trí in (màn hình & khi in danh sách/lịch giỗ) */
  /* Dùng visibility (không phải display:none) để ảnh nền được nạp + giải mã sẵn từ lúc mở trang —
     display:none làm Chrome trì hoãn decode đến đúng lúc in, preview chụp trang khi ảnh chưa sẵn sàng. */
  #printPhoto { visibility: hidden; pointer-events: none; }
  /* Ảnh mẫu gia phả làm nền toàn trang; toạ độ các lớp phủ tính theo % để khớp mọi khổ giấy */
  #printPhoto .pbg {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2;
  }
  /* Ô-van sẫm đè lên chữ "HỌ ĐỒNG" gốc giữa cuốn thư vàng, ghi tên họ mình */
  #printPhoto .ptitle {
    position: fixed; left: 50%; top: 7%; transform: translateX(-50%);
    width: 20%; height: 13.5%;
    background: radial-gradient(ellipse at 50% 42%, #3a1810 55%, #1d0c06 100%);
    border: 2px solid #c9a227; border-radius: 50%;
    box-shadow: 0 0 10px 6px rgba(30,12,6,.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #printPhoto .pt1 {
    font-family: 'Times New Roman', serif; font-weight: 700;
    font-size: 1.1vw; color: #f0cf62; letter-spacing: .3vw;
  }
  #printPhoto .pt2 {
    font-family: 'Times New Roman', serif; font-weight: 700;
    font-size: 2.1vw; color: #ffd75e; letter-spacing: .3vw; margin-top: .2vh;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  #printPhoto .pt3 {
    background: #b01f1f; color: #ffe9a8; font-weight: 700; font-size: .75vw;
    letter-spacing: .08vw; padding: .12vw .8vw; border-radius: 8px; margin-top: .5vh;
    border: 1px solid #7c1212;
  }
  /* Bảng Thủy tổ nâu cam 2 dòng — đúng vị trí bảng gốc trong ảnh mẫu */
  #printPhoto .proot {
    position: fixed; left: 50%; top: 24.8%; transform: translateX(-50%);
    background: linear-gradient(180deg, #b3341d, #8a2312);
    border: 1px solid #6b1d0d; border-radius: 5px;
    color: #fff; font-weight: 700; font-size: 1.15vw; letter-spacing: .08vw;
    padding: .45% 1.5%; white-space: nowrap; z-index: 1; text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
  }
  #printPhoto .proot .pr2 { font-size: .78vw; color: #ffe9a8; margin-top: .15vh; }
  /* Thẻ nhiều màu theo đời, viền đỏ (kiểu tranh phả đồ mẫu) */
  body.printing-tree .card { border-color: #a01212 !important; }
  body.printing-tree .card[data-doi="1"] { background: #e9a04b; }
  body.printing-tree .card[data-doi="2"] { background: #f2c063; }
  body.printing-tree .card[data-doi="3"] { background: #ffe08a; }
  body.printing-tree .card[data-doi="4"] { background: #b7d7f0; }
  body.printing-tree .card[data-doi="5"] { background: #c6e0b4; }
  body.printing-tree .card[data-doi="6"] { background: #f8cbd8; }
  body.printing-tree .card[data-doi="7"] { background: #d9d2ec; }
  /* Kiểu gọn dùng khi in phả đồ — bật bằng class trên <body> TRƯỚC khi đo kích thước,
     để scale tính vừa trang khớp với kích thước thật sẽ in ra, không phải kích thước lúc xem màn hình. */
  body.printing-tree .gio { display: none; }
  body.printing-tree .tree li { padding: 16px 4px 0; }
  body.printing-tree .tree li::before, body.printing-tree .tree li::after { height: 16px; }
  body.printing-tree .tree ul ul::before { height: 16px; }
  body.printing-tree .card { padding: 4px 6px; min-width: 90px; max-width: 140px; }
  body.printing-tree .card .ten { font-size: 12px; }
  body.printing-tree .card .doi-tag { font-size: 8px; padding: 1px 5px; margin-bottom: 2px; }
  body.printing-tree .card .chucdanh { font-size: 9px; }
  body.printing-tree .card .spouse { font-size: 10px; padding-top: 3px; margin-top: 4px; }
  /* Thành viên không có con (thường đông ở đời cuối) — xoay chữ dọc để đỡ tốn bề ngang */
  body.printing-tree .card.leaf {
    writing-mode: vertical-rl; text-orientation: mixed;
    min-width: 0; max-width: none; width: auto;
    padding: 6px 3px; white-space: nowrap;
  }
  body.printing-tree .card.leaf .doi-tag, body.printing-tree .card.leaf .chucdanh, body.printing-tree .card.leaf .spouse { display: none; }
  body.printing-tree .card.leaf .ten { font-size: 11px; }
</style>

<header>
  <h1 id="appTitle">Gia phả — Chi họ Phạm Hiếu</h1>
  <div class="toolbar">
    <input type="search" id="searchBox" placeholder="🔍 Tìm tên (vd: Hiếu Điều)..." />
    <button class="btn" id="btnAddRoot">+ Thêm thành viên</button>
    <button class="btn ghost" id="btnSheet">📄 Mở Google Sheet</button>
    <button class="btn ghost" onclick="openPrintDialog()">🖨 In</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-view="treeView">Phả đồ</button>
    <button class="tab" data-view="listView">Danh sách theo đời</button>
    <button class="tab" data-view="gioView">Ngày giỗ</button>
  </div>
</header>

<div id="loading">⏳ Đang tải dữ liệu gia phả...</div>

  var spousesOf = {};     // ID -> [vợ/chồng]
  var scale = 1, panX = 0, panY = 0;

  var DOI_LABEL = {
    1: 'Đời 1 — Tiên tổ', 2: 'Đời 2 — Cao tổ', 3: 'Đời 3 — Tằng tổ',
    4: 'Đời 4 — Hiền tổ'
  };
  function doiLabel(d) { return DOI_LABEL[d] || ('Đời ' + d + ' — Thế hệ thứ ' + d); }

  // ============ Tải dữ liệu ============
  function loadData() {
    document.getElementById('loading').style.display = 'block';
    console.log('[GiaPha] loadData: bắt đầu gọi google.script.run.getFamilyData(), typeof google.script.run =', typeof (window.google && google.script && google.script.run));
    google.script.run
      .withSuccessHandler(function (res) { console.log('[GiaPha] withSuccessHandler nhận res =', res); onData(res); })
      .withFailureHandler(function (err) { console.log('[GiaPha] withFailureHandler nhận err =', err); showError(err); })
      .getFamilyData();
  }
  function onData(res) {
    if (!res) { showError('Không tải được dữ liệu (phản hồi rỗng, xem console để biết chi tiết). Hãy thử tải lại trang.'); return; }
    if (res.error) { showError(res.message || 'Lỗi không xác định khi tải dữ liệu.'); return; }
    DATA = res;
    document.getElementById('appTitle').textContent = res.title || 'Gia phả';
    index_();
    renderAll();
    document.getElementById('loading').style.display = 'none';
    document.querySelector('.view.active') || switchView('treeView');
  }
  function index_() {
    byId = {}; childrenOf = {}; spousesOf = {};
    DATA.persons.forEach(function (p) {
      p.ID = Number(p.ID);
      byId[p.ID] = p;
    });
    DATA.persons.forEach(function (p) {
      var cha = Number(p.ChaID) || 0;
      var vc = Number(p.VoChongCuaID) || 0;
      if (vc && byId[vc]) {
        (spousesOf[vc] = spousesOf[vc] || []).push(p);
      } else if (cha && byId[cha]) {
        (childrenOf[cha] = childrenOf[cha] || []).push(p);
      }
    });
    var sortFn = function (a, b) {
      return (Number(a.ThuTu) || 99) - (Number(b.ThuTu) || 99) || a.ID - b.ID;
    };
    Object.keys(childrenOf).forEach(function (k) { childrenOf[k].sort(sortFn); });
    Object.keys(spousesOf).forEach(function (k) { spousesOf[k].sort(sortFn); });
  }
  function roots_() {
    return DATA.persons.filter(function (p) {
      return !(Number(p.ChaID) && byId[Number(p.ChaID)]) &&
             !(Number(p.VoChongCuaID) && byId[Number(p.VoChongCuaID)]);
    }).sort(function (a, b) { return (a.Doi - b.Doi) || (a.ID - b.ID); });
  }

  function renderAll() {
    renderTree();
    renderList();
    renderGio();
  }

  // ============ Phả đồ ============
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function cardHtml(p, isLeaf) {
    var spouses = spousesOf[p.ID] || [];
    var cls = 'card ' + (p.GioiTinh === 'Nữ' ? 'nu ' : '') + (isLeaf ? 'leaf' : '');
    var h = '<div class="' + cls + '" data-id="' + p.ID + '" data-doi="' + esc(p.Doi) + '" onclick="openDetail(' + p.ID + ');event.stopPropagation()">';
    h += '<span class="doi-tag">Đời ' + esc(p.Doi) + '</span>';
    h += '<div class="ten">' + esc(p.HoTen) + '</div>';
    if (p.ChucDanh) h += '<div class="chucdanh">' + esc(p.ChucDanh) + '</div>';
    if (p.NgayGio) h += '<div class="gio">🕯 Giỗ: ' + esc(p.NgayGio) + ' (ÂL)</div>';
    spouses.forEach(function (s) {
      h += '<div class="spouse" onclick="openDetail(' + s.ID + ');event.stopPropagation()">' +
           (s.GioiTinh === 'Nam' ? '🤵 ' : '👰 ') + '<b>' + esc(s.HoTen) + '</b>' +
           (s.NgayGio ? ' <span class="gio">· giỗ ' + esc(s.NgayGio) + '</span>' : '') + '</div>';
    });
    h += '</div>';
    return h;
  }
  // Gom con của cả người này lẫn (các) vợ/chồng của họ — vì vợ/chồng chỉ hiện lồng
  // trong cùng 1 thẻ chứ không phải node riêng, nên "+Thêm con" bấm từ bên nào cũng phải ra cùng chỗ.
  function allChildrenOf_(p) {
    var kids = (childrenOf[p.ID] || []).slice();
    (spousesOf[p.ID] || []).forEach(function (s) {
      (childrenOf[s.ID] || []).forEach(function (k) {
        if (kids.indexOf(k) === -1) kids.push(k);
      });
    });
    return kids.sort(function (a, b) { return (Number(a.ThuTu) || 99) - (Number(b.ThuTu) || 99) || a.ID - b.ID; });
  }
  // ChaID chỉ lưu MỘT người (cha hoặc mẹ, tuỳ lúc thêm) — vợ/chồng của người đó
  // (nếu có) chính là phụ huynh còn lại, nên gộp cả hai vào đây để hiển thị "Con của".
  function parentsOf_(p) {
    var cha = byId[Number(p.ChaID)];
    if (!cha) return [];
    var list = [cha];
    (spousesOf[cha.ID] || []).forEach(function (s) {
      if (list.indexOf(s) === -1) list.push(s);
    });
    return list;
  }
  function nodeHtml(p) {
    var kids = allChildrenOf_(p);
    var h = '<li>' + cardHtml(p, kids.length === 0);
    if (kids.length) {
      h += '<ul>' + kids.map(nodeHtml).join('') + '</ul>';
    }
    h += '</li>';
    return h;
  }
  function renderTree() {
    var roots = roots_();
    document.getElementById('treeRoot').innerHTML =
      '<ul>' + roots.map(nodeHtml).join('') + '</ul>';
    requestAnimationFrame(fitTree);
  }
  function applyTransform() {
    document.getElementById('treeCanvas').style.transform =
      'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
  }
  function fitTree() {
    var wrap = document.getElementById('treeWrap');
    var canvas = document.getElementById('treeCanvas');
    var w = canvas.scrollWidth, hgt = canvas.scrollHeight;
    if (!w || !hgt) return;
    scale = Math.min(wrap.clientWidth / w, wrap.clientHeight / hgt, 1);
    if (scale < 0.15) scale = 0.15;
    panX = (wrap.clientWidth - w * scale) / 2;
    panY = 10;
    applyTransform();
  }

  // Kéo & phóng
  (function () {
    var wrap = document.getElementById('treeWrap');
    var dragging = false, sx = 0, sy = 0;
    wrap.addEventListener('mousedown', function (e) {
      dragging = true; sx = e.clientX - panX; sy = e.clientY - panY;
      wrap.classList.add('dragging');
    });
    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      panX = e.clientX - sx; panY = e.clientY - sy; applyTransform();
    });
    window.addEventListener('mouseup', function () {
      dragging = false; wrap.classList.remove('dragging');
    });
    wrap.addEventListener('wheel', function (e) {
      e.preventDefault();
      var f = e.deltaY < 0 ? 1.12 : 0.89;
      var rect = wrap.getBoundingClientRect();
      var mx = e.clientX - rect.left, my = e.clientY - rect.top;
      panX = mx - (mx - panX) * f;
      panY = my - (my - panY) * f;
      scale *= f; applyTransform();
    }, { passive: false });
    // cảm ứng
    var lastTouch = null, lastDist = 0;
    wrap.addEventListener('touchstart', function (e) {
      if (e.touches.length === 1) lastTouch = { x: e.touches[0].clientX - panX, y: e.touches[0].clientY - panY };
      if (e.touches.length === 2) lastDist = dist_(e.touches);
    }, { passive: true });
    wrap.addEventListener('touchmove', function (e) {
      if (e.touches.length === 1 && lastTouch) {
        panX = e.touches[0].clientX - lastTouch.x;
        panY = e.touches[0].clientY - lastTouch.y;
        applyTransform();
      } else if (e.touches.length === 2) {
        var d = dist_(e.touches);
        if (lastDist) { scale *= d / lastDist; applyTransform(); }
        lastDist = d;
      }
    }, { passive: true });
    function dist_(t) {
      var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }
    document.getElementById('zin').onclick = function () { scale *= 1.2; applyTransform(); };
    document.getElementById('zout').onclick = function () { scale /= 1.2; applyTransform(); };
    document.getElementById('zfit').onclick = fitTree;
  })();

  // ============ Danh sách theo đời ============
  function renderList() {
    var byDoi = {};
    DATA.persons.forEach(function (p) {
      var d = Number(p.Doi) || 0;
      (byDoi[d] = byDoi[d] || []).push(p);
    });
    var h = '';
    Object.keys(byDoi).map(Number).sort(function (a, b) { return a - b; }).forEach(function (d) {
      h += '<div class="doi-block"><h2>' + esc(doiLabel(d)) + ' (' + byDoi[d].length + ' người)</h2>';
      h += '<table><tr><th>Họ tên</th><th>Giới tính</th><th>Quan hệ</th><th>Ngày giỗ (ÂL)</th><th>Chức danh / Ghi chú</th></tr>';
      byDoi[d].sort(function (a, b) { return a.ID - b.ID; }).forEach(function (p) {
        var qh = '';
        var parents = parentsOf_(p);
        var vc = byId[Number(p.VoChongCuaID)];
        if (parents.length) qh = 'Con cụ ' + parents.map(function (pr) { return pr.HoTen; }).join(' và ');
        else if (vc) qh = (p.GioiTinh === 'Nam' ? 'Chồng cụ ' : 'Vợ cụ ') + vc.HoTen;
        h += '<tr><td><span class="link" onclick="openDetail(' + p.ID + ')">' + esc(p.HoTen) + '</span></td>' +
          '<td>' + esc(p.GioiTinh) + '</td><td>' + esc(qh) + '</td>' +
          '<td>' + esc(p.NgayGio) + '</td>' +
          '<td>' + esc([p.ChucDanh, p.GhiChu].filter(Boolean).join(' — ')) + '</td></tr>';
      });
      h += '</table></div>';
    });
    document.getElementById('listView').innerHTML = h;
  }

  // ============ Ngày giỗ ============
  function parseGio(s) {
    var m = String(s || '').match(/(\d{1,2})\s*[\/-]\s*(\d{1,2})/);
    return m ? { d: +m[1], m: +m[2] } : null;
  }
  function renderGio() {
    var rows = DATA.persons
      .map(function (p) { return { p: p, g: parseGio(p.NgayGio) }; })
      .filter(function (x) { return x.g; })
      .sort(function (a, b) { return (a.g.m - b.g.m) || (a.g.d - b.g.d); });
    var h = '<div class="doi-block"><h2>🕯 Lịch giỗ trong năm (âm lịch) — ' + rows.length + ' cụ</h2>';
    h += '<table><tr><th>Ngày (ÂL)</th><th>Họ tên</th><th>Đời</th><th>Chức danh</th></tr>';
    rows.forEach(function (x) {
      h += '<tr><td><b>' + x.g.d + '/' + x.g.m + '</b></td>' +
        '<td><span class="link" onclick="openDetail(' + x.p.ID + ')">' + esc(x.p.HoTen) + '</span></td>' +
        '<td>' + esc(x.p.Doi) + '</td><td>' + esc(x.p.ChucDanh) + '</td></tr>';
    });
    h += '</table>';
    h += '<p style="margin-top:8px;font-size:13px;color:#666">Ngày giỗ ghi theo âm lịch dạng <b>ngày/tháng</b>, trích từ phả đồ gốc.</p></div>';
    document.getElementById('gioView').innerHTML = h;
  }

  // ============ Modal chi tiết / sửa ============
  function openDetail(id) {
    var p = byId[id];
    if (!p) return;
    var parents = parentsOf_(p);
    var vc = byId[Number(p.VoChongCuaID)];
    var kids = allChildrenOf_(p);
    var sps = spousesOf[id] || [];
    var h = '';
    h += '<div class="info-line"><b>' + esc(p.HoTen) + '</b>' + (p.GioiTinh ? ' (' + esc(p.GioiTinh) + ')' : '') + ' — ' + esc(doiLabel(Number(p.Doi))) + '</div>';
    if (p.ChucDanh) h += '<div class="info-line">Chức danh: <b>' + esc(p.ChucDanh) + '</b></div>';
    if (p.NgayGio) h += '<div class="info-line">🕯 Ngày giỗ: <b>' + esc(p.NgayGio) + '</b> (âm lịch)</div>';
    if (p.NamSinh) h += '<div class="info-line">🌱 Năm sinh: <b>' + esc(p.NamSinh) + '</b></div>';
    if (p.NamMat) h += '<div class="info-line">🕊 Năm mất: <b>' + esc(p.NamMat) + '</b></div>';
    if (parents.length) h += '<div class="info-line">Con của: ' + parents.map(function (pr) {
      return '<span class="link" onclick="openDetail(' + pr.ID + ')">' + esc(pr.HoTen) + '</span>';
    }).join(' và ') + '</div>';
    if (vc) h += '<div class="info-line">' + (p.GioiTinh === 'Nam' ? 'Chồng' : 'Vợ') + ' của: <span class="link" onclick="openDetail(' + vc.ID + ')">' + esc(vc.HoTen) + '</span></div>';
    if (sps.length) h += '<div class="info-line">Vợ/chồng: ' + sps.map(function (s) { return '<span class="link" onclick="openDetail(' + s.ID + ')">' + esc(s.HoTen) + '</span>'; }).join(', ') + '</div>';
    if (kids.length) h += '<div class="info-line">Con (' + kids.length + '): ' + kids.map(function (k) { return '<span class="link" onclick="openDetail(' + k.ID + ')">' + esc(k.HoTen) + '</span>'; }).join(', ') + '</div>';
    if (p.GhiChu) h += '<div class="info-line">📝 ' + esc(p.GhiChu) + '</div>';
    h += '<div class="modal-actions">' +
      '<button class="btn solid" onclick="openForm(' + id + ')">✏️ Sửa</button>' +
      '<button class="btn" onclick="openForm(null,' + id + ',false)">+ Thêm con</button>' +
      '<button class="btn" onclick="openForm(null,' + id + ',true)">+ Thêm vợ/chồng</button>' +
      '<button class="btn danger" onclick="removePerson(' + id + ')">🗑 Xóa</button>' +
      '</div>';
    showModal(esc(p.HoTen), h);
  }

  function openForm(id, relatedId, asSpouse) {
    var p = id ? byId[id] : {};
    var rel = relatedId ? byId[relatedId] : null;
    var doi = p.Doi || (rel ? (asSpouse ? Number(rel.Doi) : Number(rel.Doi) + 1) : 1);
    var title = id ? 'Sửa: ' + p.HoTen
      : (rel ? (asSpouse ? 'Thêm vợ/chồng cho cụ ' + rel.HoTen : 'Thêm con cho cụ ' + rel.HoTen) : 'Thêm thành viên');
    var h = '<form onsubmit="submitForm(event)">';
    h += '<input type="hidden" name="ID" value="' + (id || '') + '">';

    var isAddChild = !id && rel && !asSpouse;
    if (isAddChild) {
      // Vợ/chồng "gốc" của rel (người khác trỏ VoChongCuaID về rel — thường là các vợ nếu rel là suất đinh)
      // được tự chọn nếu chỉ có đúng 1 người, còn nhiều hơn thì bắt buộc phải chọn tay.
      // Nếu rel chính là vợ (rel.VoChongCuaID trỏ sang chồng) thì mặc định là "con riêng", phải chọn tay mới tính là con chung.
      var partners = [];
      (spousesOf[rel.ID] || []).forEach(function (s) { partners.push({ person: s, auto: true }); });
      if (rel.VoChongCuaID && byId[Number(rel.VoChongCuaID)]) partners.push({ person: byId[Number(rel.VoChongCuaID)], auto: false });
      if (partners.length) {
        var autoPick = (partners.length === 1 && partners[0].auto) ? partners[0].person.ID : null;
        var vaiTro = rel.GioiTinh === 'Nữ' ? 'Cha' : 'Mẹ';
        h += '<div class="field"><label>' + vaiTro + ' của con này</label><select name="ChaID">';
        h += '<option value="' + rel.ID + '"' + (autoPick ? '' : ' selected') + '>— Con riêng (chỉ tính là con của cụ ' + esc(rel.HoTen) + ') —</option>';
        partners.forEach(function (pt) {
          h += '<option value="' + pt.person.ID + '"' + (autoPick === pt.person.ID ? ' selected' : '') + '>' + esc(pt.person.HoTen) + '</option>';
        });
        h += '</select></div>';
      } else {
        h += '<input type="hidden" name="ChaID" value="' + rel.ID + '">';
      }
    } else {
      h += '<input type="hidden" name="ChaID" value="' + esc(id ? (p.ChaID || '') : '') + '">';
    }
    h += '<input type="hidden" name="VoChongCuaID" value="' + esc(id ? (p.VoChongCuaID || '') : (asSpouse && rel ? rel.ID : '')) + '">';
    h += '<div class="field"><label>Họ tên *</label><input name="HoTen" required value="' + esc(p.HoTen || '') + '"></div>';
    h += '<div class="row2">';
    h += '<div class="field"><label>Giới tính</label><select name="GioiTinh">' +
      ['', 'Nam', 'Nữ'].map(function (g) {
        return '<option value="' + g + '"' + (p.GioiTinh === g ? ' selected' : '') + '>' + (g || '—') + '</option>';
      }).join('') + '</select></div>';
    h += '<div class="field"><label>Đời thứ</label><input name="Doi" type="number" min="1" value="' + esc(doi) + '"></div>';
    h += '</div><div class="row2">';
    h += '<div class="field"><label>Ngày giỗ (ÂL, vd 18/12)</label><input name="NgayGio" value="' + esc(p.NgayGio || '') + '"></div>';
    h += '<div class="field"><label>Thứ tự anh chị em</label><input name="ThuTu" type="number" min="1" value="' + esc(p.ThuTu || '') + '"></div>';
    h += '</div><div class="row2">';
    h += '<div class="field"><label>Năm sinh</label><input name="NamSinh" value="' + esc(p.NamSinh || '') + '"></div>';
    h += '<div class="field"><label>Năm mất</label><input name="NamMat" value="' + esc(p.NamMat || '') + '"></div>';
    h += '</div>';
    h += '<div class="field"><label>Chức danh (vd: Chi trưởng, Tổ cô...)</label><input name="ChucDanh" value="' + esc(p.ChucDanh || '') + '"></div>';
    h += '<div class="field"><label>Ghi chú</label><textarea name="GhiChu">' + esc(p.GhiChu || '') + '</textarea></div>';
    h += '<div class="modal-actions"><button type="submit" class="btn solid">💾 Lưu</button>' +
      '<button type="button" class="btn" onclick="closeModal()">Hủy</button></div>';
    h += '</form>';
    showModal(title, h);
  }

  function submitForm(e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    var person = {};
    fd.forEach(function (v, k) { person[k] = v; });
    busy('Đang lưu...');
    google.script.run
      .withSuccessHandler(function (res) {
        console.log('[GiaPha] savePerson res =', res);
        if (!res || res.error) { showError((res && res.message) || 'Lưu thất bại (phản hồi rỗng).'); return; }
        onData(res); closeModal(); toast('✅ Đã lưu.');
      })
      .withFailureHandler(function (err) { console.log('[GiaPha] savePerson err =', err); showError(err); })
      .savePerson(person);
  }

  function removePerson(id) {
    var p = byId[id];
    if (!confirm('Xóa "' + p.HoTen + '" khỏi gia phả?')) return;
    busy('Đang xóa...');
    google.script.run
      .withSuccessHandler(function (res) {
        console.log('[GiaPha] deletePerson res =', res);
        if (!res || res.error) { showError((res && res.message) || 'Xóa thất bại (phản hồi rỗng).'); return; }
        onData(res); closeModal(); toast('🗑 Đã xóa.');
      })
      .withFailureHandler(function (err) { console.log('[GiaPha] deletePerson err =', err); showError(err); })
      .deletePerson(id);
  }

  // ============ In phả đồ vừa khổ giấy ============
  var PAPER_MM = { A4: [210, 297], A3: [297, 420] };
  function openPrintDialog() {
    var isTree = document.getElementById('treeView').classList.contains('active');
    if (!isTree) { window.print(); return; }
    var opts = [
      ['A4', 'portrait', 'A4 — dọc'],
      ['A4', 'landscape', 'A4 — ngang'],
      ['A3', 'portrait', 'A3 — dọc'],
      ['A3', 'landscape', 'A3 — ngang']
    ];
    var h = '<p style="font-size:13px;color:#666;margin-bottom:12px">Phả đồ sẽ tự thu nhỏ vừa khít 1 trang giấy đã chọn.</p>';
    h += '<div class="modal-actions" style="flex-direction:column;align-items:stretch">';
    opts.forEach(function (o) {
      h += '<button type="button" class="btn solid" style="margin-bottom:8px" onclick="printTree(\'' + o[0] + '\',\'' + o[1] + '\')">🖨 In khổ ' + o[2] + '</button>';
    });
    h += '<button type="button" class="btn" onclick="closeModal()">Hủy</button></div>';
    showModal('In phả đồ — chọn khổ giấy', h);
  }
  function printTree(paper, orientation) {
    closeModal();
    document.body.classList.add('printing-tree'); // bật kiểu gọn TRƯỚC khi đo kích thước thật

    var canvas = document.getElementById('treeCanvas');
    var prevTransform = canvas.style.transform;
    canvas.style.transform = 'none'; // đo ở tỉ lệ 1:1 thật, bỏ qua pan/zoom đang xem trên màn hình

    // Đo bounding box THẬT của toàn bộ thẻ (kể cả thẻ xoay dọc) — không dùng scrollWidth/flexbox
    // vì khung layout gốc có thể rộng/lệch hơn nội dung thật sự hiển thị, canh theo khung sẽ vẫn lệch.
    var canvasRect = canvas.getBoundingClientRect();
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    canvas.querySelectorAll('.card').forEach(function (c) {
      var r = c.getBoundingClientRect();
      if (r.left < minX) minX = r.left;
      if (r.top < minY) minY = r.top;
      if (r.right > maxX) maxX = r.right;
      if (r.bottom > maxY) maxY = r.bottom;
    });
    var contentLeft = minX - canvasRect.left;
    var contentTop = minY - canvasRect.top;
    var naturalW = maxX - minX, naturalH = maxY - minY;
    var canvasW = canvasRect.width; // bề rộng shrink-wrap thật của canvas trên màn hình

    canvas.style.transform = prevTransform; // trả lại transform màn hình (lúc in sẽ bị @media print đè lên)

    var mm = PAPER_MM[paper].slice();
    if (orientation === 'landscape') mm.reverse();
    var marginMm = 5;
    var pxPerMm = 96 / 25.4;
    var fullW = (mm[0] - marginMm * 2) * pxPerMm;
    var fullH = (mm[1] - marginMm * 2) * pxPerMm;
    // Bố cục theo nền vector (đã crop sát khung): cây bắt đầu dưới bảng Thủy tổ (~31.5%),
    // nằm trong vùng che (ngang 84%, dọc tới ~94%).
    var topOffset = Math.round(fullH * 0.335);
    var availW = fullW * 0.80;
    var availH = fullH * 0.615;
    // Nhân thêm 0.97 để chừa chút dư an toàn, tránh tràn mép nếu đo hụt.
    var printScale = Math.min(availW / naturalW, availH / naturalH, 2.2) * 0.97;
    // Ngang: canh giữa theo bounding box thật trên TOÀN bề rộng trang.
    var offsetX = (fullW - naturalW * printScale) / 2 - contentLeft * printScale;
    var offsetY = -contentTop * printScale;
    // transform scale KHÔNG làm nhỏ khối layout, nên phải ghim chiều cao khung đúng bằng
    // chiều cao đã scale để không tràn sang trang sau; overflow hidden chặn cả tràn ngang.
    var wrapH = Math.ceil(naturalH * printScale) + 4;

    var styleTag = document.getElementById('printPageStyle') || document.createElement('style');
    styleTag.id = 'printPageStyle';
    styleTag.textContent =
      '@page { size: ' + paper + ' ' + orientation + '; margin: ' + marginMm + 'mm; }' +
      '@media print {' +
      // Canvas phải giữ position:absolute + ghim bề rộng tường minh bằng số đã đo trên màn hình:
      // - nếu để static: min-content của cây lan lên document, Chrome bật shrink-to-fit co nhỏ CẢ trang;
      // - nếu absolute nhưng không ghim width: canvas bị ép theo bề rộng trang, flexbox bên trong
      //   tự căn giữa lại và tràn đều 2 mép, làm sai mọi toạ độ đã đo (mép trái cắt, mép phải thừa).
      '  #treeWrap { position: relative; margin-top: ' + topOffset + 'px; height: ' + wrapH + 'px !important; overflow: hidden !important; }' +
      '  #treeCanvas { position: absolute !important; left: 0; top: 0; width: ' + Math.ceil(canvasW) + 'px !important;' +
      '    transform: translate(' + offsetX.toFixed(1) + 'px,' + offsetY.toFixed(1) + 'px) scale(' + printScale.toFixed(4) + ') !important; transform-origin: 0 0 !important; }' +
      '}';
    document.head.appendChild(styleTag);

    function cleanup() {
      styleTag.remove();
      document.body.classList.remove('printing-tree');
      window.removeEventListener('afterprint', cleanup);
    }
    window.addEventListener('afterprint', cleanup);
    // Đợi ảnh nền decode xong rồi mới mở hộp thoại in; có timeout dự phòng để không bao giờ kẹt.
    var bg = document.querySelector('#printPhoto .pbg');
    var fired = false;
    function doPrint() {
      if (fired) return;
      fired = true;
      setTimeout(function () { window.print(); }, 50);
    }
    if (bg && bg.decode) {
      bg.decode().then(doPrint, doPrint);
      setTimeout(doPrint, 500);
    } else {
      doPrint();
    }
  }

  function showModal(title, bodyHtml) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('overlay').classList.add('open');
  }
  function closeModal() { document.getElementById('overlay').classList.remove('open'); }
  document.getElementById('overlay').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  // ============ Tìm kiếm ============
  function normalize(s) {
    return String(s || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd');
  }
  document.getElementById('searchBox').addEventListener('input', function () {
    var q = normalize(this.value.trim());
    document.querySelectorAll('.card').forEach(function (c) { c.classList.remove('hl'); });
    if (!q) return;
    var hit = null;
    DATA.persons.forEach(function (p) {
      if (normalize(p.HoTen).indexOf(q) !== -1) {
        var el = document.querySelector('.card[data-id="' + p.ID + '"]');
        if (el) { el.classList.add('hl'); if (!hit) hit = el; }
      }
    });
    if (hit && document.getElementById('treeView').classList.contains('active')) {
      // đưa thẻ đầu tiên tìm được vào giữa màn hình
      var wrap = document.getElementById('treeWrap');
      var canvas = document.getElementById('treeCanvas');
      var cr = canvas.getBoundingClientRect(), hr = hit.getBoundingClientRect();
      var cx = (hr.left + hr.width / 2 - cr.left) / scale;
      var cy = (hr.top + hr.height / 2 - cr.top) / scale;
      panX = wrap.clientWidth / 2 - cx * scale;
      panY = wrap.clientHeight / 2 - cy * scale;
      applyTransform();
    }
  });

  // ============ Tabs & nút chung ============
  function switchView(idOrEl) {
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.view === idOrEl);
    });
    document.querySelectorAll('.view').forEach(function (v) {
      v.classList.toggle('active', v.id === idOrEl);
    });
    if (idOrEl === 'treeView') requestAnimationFrame(fitTree);
  }
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { switchView(t.dataset.view); });
  });
  document.getElementById('btnSheet').onclick = function () {
    if (DATA && DATA.sheetUrl) window.open(DATA.sheetUrl, '_blank');
  };
  document.getElementById('btnAddRoot').onclick = function () { openForm(null, null, false); };

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.style.display = 'none'; }, 2500);
  }
  function busy(msg) { toast(msg); }
  function showError(err) {
    toast('⚠️ ' + (err && err.message ? err.message : err));
    document.getElementById('loading').style.display = 'none';
  }

  switchView('treeView');
  loadData();
</script>
